<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personalized Webpage</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <div class="bg-white shadow-2xl rounded-3xl p-8 w-full max-w-xl">

    <h1 class="text-4xl font-bold text-center text-gray-800 mb-6">
      Personalized Webpage
    </h1>

    <form id="userForm" class="space-y-4">

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        required
        class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
      >

      <input
        type="number"
        id="age"
        placeholder="Enter your age"
        required
        class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
      >

      <button
        type="submit"
        class="w-full bg-maroon-600 text-white py-3 rounded-xl font-semibold hover:bg-purple-700 transition"
      >
        Save Information
      </button>

    </form>

    <div id="greeting" class="mt-6 text-xl font-semibold text-gray-800"></div>

    <div id="months" class="mt-3 text-gray-700"></div>

    <div id="adultContent" class="mt-3 font-medium"></div>

    <div id="quotes" class="mt-6 space-y-3"></div>

  </div>

   <script src="script.js" type="text/javascript"></script>

</body>
</html>
